name: Native candidate

on:
  push:
    branches: [main, 'mvp/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: amux
            gui: amux-desktop
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: amux.exe
            gui: amux-desktop.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup override set 1.96.1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core behavioral tests
        run: cargo test --locked --no-default-features --tests
      - name: Check desktop and CLI
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native terminal adapter tests
        run: cargo test --locked --bin amux --test terminal_contract --test recipient_contract --test terminal_lifecycle_contract --test windows_terminal_lifecycle_contract
      - name: Native terminal protocol tests
        run: cargo test --locked -p iced_term amux_tests
      - name: CLI and GUI entry tests
        run: cargo test --locked --test entry_contract
      - name: Desktop notification contracts
        run: cargo test --locked --test notifications_contract --test native_notification_contract
      - name: Native release build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin amux --bin amux-desktop
      - name: Prepare review bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.binary }}' bundle/
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.gui }}' bundle/
          Copy-Item docs/windows-review.md bundle/REVIEW.md
          Copy-Item docs/notification-validation.md bundle/notification-validation.md
          Copy-Item LICENSE bundle/
          Copy-Item vendor/iced_term/LICENSE bundle/ICED_TERM_LICENSE
          # binary_sha256 stays the CLI hash for existing reviewers.
          $hash = (Get-FileHash 'bundle/${{ matrix.binary }}' -Algorithm SHA256).Hash.ToLower()
          $gui = (Get-FileHash 'bundle/${{ matrix.gui }}' -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary }}", "$gui  ${{ matrix.gui }}" | Set-Content bundle/SHA256SUMS -Encoding utf8
          $metadata = @{
            revision = '${{ github.sha }}'
            target = '${{ matrix.target }}'
            runner = '${{ matrix.os }}'
            rustc = (rustc --version)
            binary_sha256 = $hash
            gui_binary = '${{ matrix.gui }}'
            gui_binary_sha256 = $gui
            candidate_only = $true
            native_runtime_acceptance = 'pending CMUX platform review'
          }
          $metadata | ConvertTo-Json | Set-Content bundle/BUILD.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: amux-${{ matrix.target }}-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
