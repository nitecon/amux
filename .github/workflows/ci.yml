name: Native build and release

on:
  push:
    branches: [main, 'mvp/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: amux
            gui: amux-desktop
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: amux.exe
            gui: amux-desktop.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/package_release.py --check-tag '${{ github.ref_name }}'
      - name: Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Select Rust
        run: rustup override set 1.96.1
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core behavioral tests
        run: cargo test --locked --no-default-features --tests
      - name: Check desktop and CLI
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native terminal adapter tests
        run: cargo test --locked --bin amux --test terminal_contract --test terminal_paths_contract --test recipient_contract --test terminal_lifecycle_contract --test windows_terminal_lifecycle_contract
      - name: Native terminal protocol tests
        run: cargo test --locked -p iced_term amux_tests
      - name: Portable agent prompt contracts
        run: cargo test --locked --test delegation_readiness_contract
      - name: CLI and GUI entry tests
        run: cargo test --locked --test entry_contract
      - name: Desktop notification contracts
        run: cargo test --locked --test notifications_contract --test native_notification_contract
      - name: Native release build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin amux --bin amux-desktop
      - name: Verify portable Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/check_windows_runtime.ps1 -Binaries @('target/${{ matrix.target }}/release/amux.exe', 'target/${{ matrix.target }}/release/amux-desktop.exe')
          & 'target/${{ matrix.target }}/release/amux.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI failed to start' }
          $desktop = Start-Process -FilePath 'target/${{ matrix.target }}/release/amux-desktop.exe' -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru
          if ($desktop.ExitCode -ne 0) { throw 'Portable desktop failed to start' }
      - name: Prepare portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.binary }}' bundle/
          Copy-Item 'target/${{ matrix.target }}/release/${{ matrix.gui }}' bundle/
          Copy-Item docs/windows-review.md bundle/REVIEW.md
          Copy-Item docs/notification-validation.md bundle/notification-validation.md
          Copy-Item LICENSE bundle/
          Copy-Item vendor/iced_term/LICENSE bundle/ICED_TERM_LICENSE
          # Preserve the existing update archive format while including icon attribution.
          Add-Content bundle/ICED_TERM_LICENSE "`nLucide icons`n"
          Get-Content assets/icons/design/LICENSE -Raw | Add-Content bundle/ICED_TERM_LICENSE
          # binary_sha256 stays the CLI hash for existing reviewers.
          $hash = (Get-FileHash 'bundle/${{ matrix.binary }}' -Algorithm SHA256).Hash.ToLower()
          $gui = (Get-FileHash 'bundle/${{ matrix.gui }}' -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary }}", "$gui  ${{ matrix.gui }}" | Set-Content bundle/SHA256SUMS -Encoding utf8
          $package = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $metadata = @{
            revision = '${{ github.sha }}'
            target = '${{ matrix.target }}'
            runner = '${{ matrix.os }}'
            rustc = (rustc --version)
            binary_sha256 = $hash
            gui_binary = '${{ matrix.gui }}'
            gui_binary_sha256 = $gui
            version = $package.packages[0].version
            candidate_only = -not ('${{ github.ref }}'.StartsWith('refs/tags/v'))
            native_runtime_acceptance = 'pending CMUX platform review'
          }
          $metadata | ConvertTo-Json | Set-Content bundle/BUILD.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: amux-${{ matrix.target }}-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14

  # Mac App Store client. Signing and upload run only once the MAS_* secrets
  # exist (see docs/macos-app-store.md); until then this builds an unsigned app.
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MAS_APP_IDENTITY: ${{ secrets.MAS_APP_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy
      - name: Select Rust
        run: rustup override set 1.96.1
      - name: Core behavioral tests
        run: cargo test --locked --no-default-features --tests
      - name: Check desktop and CLI
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native release build
        run: cargo build --locked --release --target aarch64-apple-darwin --bin amux --bin amux-desktop
      - name: Import App Store signing identities
        if: env.MAS_APP_IDENTITY != ''
        env:
          MAS_APP_CERTIFICATE: ${{ secrets.MAS_APP_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          for cert in MAS_APP_CERTIFICATE MAS_INSTALLER_CERTIFICATE; do
            printenv "$cert" | base64 --decode > "$RUNNER_TEMP/$cert.p12"
            security import "$RUNNER_TEMP/$cert.p12" -k "$keychain" -P "$MAS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$MAS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/amux.provisionprofile"
      - name: Package amux.app
        env:
          MAS_INSTALLER_IDENTITY: ${{ secrets.MAS_INSTALLER_IDENTITY }}
        run: |
          if [ -n "$MAS_APP_IDENTITY" ]; then export MAS_PROVISIONING_PROFILE="$RUNNER_TEMP/amux.provisionprofile"; fi
          mkdir -p macos
          sh scripts/package_macos.sh target/aarch64-apple-darwin/release macos
          macos/amux.app/Contents/MacOS/amux --version
          macos/amux.app/Contents/MacOS/amux-desktop --version
          rm -rf macos/amux.app
      - name: Upload to App Store Connect
        if: env.MAS_APP_IDENTITY != '' && startsWith(github.ref, 'refs/tags/v')
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APP_STORE_CONNECT_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          xcrun altool --upload-app --type macos --file macos/amux-macos-v*.pkg \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: amux-aarch64-apple-darwin-${{ github.sha }}
          path: macos/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify and package both platforms
        env:
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: |
          python scripts/package_release.py --tag "$TAG" --revision "$REVISION" --artifacts artifacts --output dist
          # The unsigned macOS app ships beside the portable bundles; the updater ignores it.
          cp "artifacts/amux-aarch64-apple-darwin-$REVISION/amux-macos-aarch64-$TAG.zip" dist/
          (cd dist && sha256sum "amux-macos-aarch64-$TAG.zip" >> SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        run: >-
          gh release create "$TAG" dist/* --verify-tag --target "$REVISION"
          --title "amux $TAG" --generate-notes
          --notes "Portable Linux and Windows release, plus an unsigned macOS (Apple Silicon) app preview. Extract the complete bundle and keep both executables with BUILD.json. Existing supported direct-download installs can run amux --update, then use the desktop bell to restart. See https://github.com/nitecon/amux/blob/$TAG/docs/updates.md for instructions."
