name: amux packaging

on:
  pull_request:
  push:
    branches: [main, go-rebuild, 'mvp/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            archive: tar.gz
            ext: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            archive: zip
            ext: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            archive: zip
            ext: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      AMUX_BUNDLED_DIR: ${{ github.workspace }}/target/bundled
      AMUX_BUNDLED_CONTRACT_DIR: ${{ github.workspace }}/target/bundled
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          update: false
      - name: Add Windows C compiler to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          if (-not (Test-Path "$mingw\gcc.exe")) { throw "UCRT64 GCC is missing from $mingw" }
          Add-Content -Path $env:GITHUB_PATH -Value $mingw
          & "$mingw\gcc.exe" --version
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev libwayland-dev libxkbcommon-dev xorg-dev
      - name: Fetch pinned bundled tools
        run: go run ./cmd/amux-release tools --target ${{ matrix.target }} --output target/bundled
      - name: Test Go packages
        run: go test ./...
      - name: Prepare build directory
        shell: bash
        run: mkdir -p bin
      - name: Build CLI
        run: go build -trimpath -o "bin/amux${{ matrix.ext }}" ./cmd/amux
      - name: Build desktop
        if: runner.os != 'Windows'
        run: go build -tags desktop -trimpath -o "bin/amux-desktop${{ matrix.ext }}" ./cmd/amux-desktop
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        run: go build -tags desktop -trimpath -ldflags "-H=windowsgui" -o bin/amux-desktop.exe ./cmd/amux-desktop
      - name: Desktop CLI argument smoke
        shell: bash
        run: |
          # --help validates argument parsing and binary startup only; it does
          # not open the GUI or prove that a graphical session can render it.
          bin/amux-desktop${{ matrix.ext }} --project-dir "$GITHUB_WORKSPACE" --help
      - name: Assemble and smoke test portable install
        shell: bash
        env:
          AMUX_RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/install
          cp "bin/amux${{ matrix.ext }}" "bin/amux-desktop${{ matrix.ext }}" dist/install/
          cp "target/bundled/agent-tools${{ matrix.ext }}" "target/bundled/memory${{ matrix.ext }}" dist/install/
          cp LICENSE dist/install/
          cp assets/models.json dist/install/models.json
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            go run ./cmd/amux-release check-tag "$GITHUB_REF_NAME"
            package_name="amux-${{ matrix.platform }}-$GITHUB_REF_NAME.${{ matrix.archive }}"
            version_args=(--version "$GITHUB_REF_NAME")
          else
            package_name="amux-${{ matrix.platform }}-$GITHUB_SHA.${{ matrix.archive }}"
            version_args=(--candidate-only)
          fi
          go run ./cmd/amux-release package --bundle dist/install --target "${{ matrix.target }}" --revision "$GITHUB_SHA" --output "dist/$package_name" "${version_args[@]}"
          go run ./cmd/amux-release smoke --bundle "dist/$package_name" --target "${{ matrix.target }}" --revision "$GITHUB_SHA" --output dist/installed
      - name: Verify upgrade with the shipped updater
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          directory=dist
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            tag=v0.0.83
            directory=dist/handoff
            go run ./cmd/amux-release package --bundle dist/install --target "${{ matrix.target }}" --revision "$GITHUB_SHA" \
              --version "$tag" --output "$directory/amux-${{ matrix.platform }}-$tag.${{ matrix.archive }}"
          fi
          python scripts/test_release_handoff.py "$directory/amux-${{ matrix.platform }}-$tag.${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: amux-${{ matrix.platform }}-${{ github.sha }}
          path: dist/amux-${{ matrix.platform }}-*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish amux release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./cmd/amux-release check-tag "$TAG"
          mkdir -p dist
          for asset in "amux-linux-x86_64-$TAG.tar.gz" "amux-windows-x86_64-$TAG.zip" "amux-macos-aarch64-$TAG.zip"; do
            cp "artifacts/amux-"*/"$asset" dist/
          done
          (cd dist && sha256sum amux-* > SHA256SUMS)
          gh release create "$TAG" dist/* --verify-tag --target "$GITHUB_SHA" --title "amux $TAG" --generate-notes
