[package]
name = "amux"
version = "0.0.35"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "Local agent terminals and gateway task coordination"
default-run = "amux"

[workspace]
members = ["crates/gateway-backend"]
default-members = [".", "crates/gateway-backend"]
resolver = "2"

[features]
default = ["desktop"]
desktop = ["dep:iced", "dep:iced_term", "dep:notify-rust"]

# GUI entry point: no Windows console. Desktop tests already run in the CLI binary.
[[bin]]
name = "amux-desktop"
path = "src/bin/amux-desktop.rs"
required-features = ["desktop"]
test = false

[dependencies]
amux-gateway-backend = { path = "crates/gateway-backend" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
getrandom = "0.3"
futures-util = "0.3"
httpdate = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
iced = { version = "0.14", features = ["tokio", "advanced", "lazy", "svg"], optional = true }
iced_term = { version = "=0.8.0", path = "vendor/iced_term", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "net", "sync"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tempfile = "3"
toml_edit = "0.25"
dotenvy = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Verified direct-download updates (src/updates.rs).
flate2 = "1.1"
self-replace = "1.5"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
axum = { version = "=0.8.8", features = ["ws"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Linux/macOS desktop notifications; Windows uses the notification area directly.
[target.'cfg(not(windows))'.dependencies]
notify-rust = { version = "4.18", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

